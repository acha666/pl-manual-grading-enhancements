name: Docker deployment E2E

on:
  workflow_call:
    inputs:
      image:
        description: Official PrairieLearn image override (empty uses the pinned digest)
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  e2e:
    name: Chromium against official PrairieLearn Docker deployment
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: Start isolated deployment and run browser tests
        env:
          PRAIRIELEARN_IMAGE: ${{ inputs.image }}
        run: npm run test:e2e
      - name: Upload deployment identity, logs, and browser diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prairielearn-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: warn
