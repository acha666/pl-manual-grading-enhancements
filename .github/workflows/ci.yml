name: Manual grading enhancements CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: Browser and controller tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    timeout-minutes: 10
    steps:
      - name: Check out course element
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install JavaScript test dependencies
        run: npm ci

      - name: Verify formatting, types, bundle behavior, and controller
        run: npm run verify

  e2e:
    uses: ./.github/workflows/e2e.yml
