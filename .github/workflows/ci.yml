name: Manual grading enhancements CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Browser and controller tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    timeout-minutes: 10
    steps:
      - name: Check out course element
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install JavaScript test dependencies
        run: npm ci

      - name: Run browser-behavior tests
        run: npm test

      - name: Run controller tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Run syntax and metadata checks
        shell: bash
        run: |
          set -euo pipefail
          for file in elements/pl-manual-grading-enhancements/src/*.js; do
            node --check "$file"
          done
          python -m json.tool elements/pl-manual-grading-enhancements/info.json >/dev/null
          python -m py_compile elements/pl-manual-grading-enhancements/controller.py
